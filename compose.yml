services:
  backend:
    build:
      context: ./
      dockerfile: deploy/docker/backend.Dockerfile
    image: kachow-backend:dev
    container_name: kachow_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/workspace/app
      - ./backend/tests:/workspace/tests
      - ./backend/alembic:/workspace/alembic
      - ./backend/alembic.ini:/workspace/alembic.ini
      - ./backend/pyproject.toml:/workspace/pyproject.toml
      - ./scripts:/workspace/scripts
      - ./datasets:/workspace/datasets
      # The evaluation harness and its gold sets. Mounted rather than only
      # baked into the image so `make eval` picks up dataset edits without a
      # rebuild -- the gold sets are edited far more often than the code.
      - ./evaluation:/workspace/evaluation
    environment:
      - ENVIRONMENT=development
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_REASONING=${OLLAMA_REASONING:-false}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-4096}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      # Derived from the same POSTGRES_* values as the db service below, so
      # the two can never drift out of sync with each other.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kachow}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-1234567890}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-1234567890}
      - LANGFUSE_HOST=http://langfuse:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - qdrant

  db:
    image: pgvector/pgvector:pg16
    container_name: kachow_db_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kachow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:7-alpine
    container_name: kachow_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kachow_qdrant_dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus:latest
    container_name: kachow_prometheus_dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: kachow_grafana_dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  langfuse:
    # v2 server is not compatible with the v4 langfuse Python SDK the backend
    # depends on (backend/requirements.txt); v3 is the matching server line.
    image: langfuse/langfuse:3
    container_name: kachow_langfuse_dev
    ports:
      - "3000:3000"
    environment:
      # A separate "langfuse" database on the same Postgres instance/creds as
      # the app's own db -- not POSTGRES_DB, which is the app's "kachow" db.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-my_nextauth_secret_for_dev_only_123}
      - SALT=${LANGFUSE_SALT:-my_salt_for_dev_only_123}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
    depends_on:
      - db

  frontend:
    build:
      context: ./
      dockerfile: deploy/docker/frontend.Dockerfile
    image: kachow-frontend:dev
    container_name: kachow_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
