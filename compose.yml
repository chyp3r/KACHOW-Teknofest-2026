version: '3.8'

services:
  backend:
    build:
      context: ./
      dockerfile: deploy/docker/backend.Dockerfile
    image: kachow-backend:dev
    container_name: kachow_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/workspace/app
      - ./backend/tests:/workspace/tests
      - ./scripts:/workspace/scripts
    environment:
      - ENVIRONMENT=development
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3.5:9b
      - OLLAMA_TEMPERATURE=0.7
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/kachow
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - qdrant

  db:
    image: postgres:15
    container_name: kachow_db_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=kachow
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kachow_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kachow_qdrant_dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
