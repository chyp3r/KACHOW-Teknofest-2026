services:
  backend:
    build:
      context: ./
      dockerfile: deploy/docker/backend.Dockerfile
    image: kachow-backend:dev
    container_name: kachow_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/workspace/app
      - ./backend/tests:/workspace/tests
      - ./backend/alembic:/workspace/alembic
      - ./backend/alembic.ini:/workspace/alembic.ini
      - ./backend/pyproject.toml:/workspace/pyproject.toml
      - ./scripts:/workspace/scripts
      - ./datasets:/workspace/datasets
      # Değerlendirme (eval) harness'ı ve gold set'ler -- `make eval` yeniden
      # derleme olmadan dataset düzenlemelerini görsün diye mount edilir.
      - ./evaluation:/workspace/evaluation
      # k6 yük testi betikleri ve export_budgets.py çıktısı -- yazımı host'a
      # düşüp commit'lenebilsin diye (--rm ile kaybolmaz).
      - ./perf:/workspace/perf
      # Yüklenen evraklar ve analiz önbelleği (settings.LOCAL_STORAGE_DIR).
      # Mount edilmezse analiz JSON'ları container yeniden oluşturulunca
      # kaybolur: evrak kütüphanede görünür ama açılınca "analiz bulunamadı".
      - ./backend/storage_data:/workspace/storage_data
    environment:
      - ENVIRONMENT=development
      # Yalnızca yerel demo. Üretim, auth kapalıyken başlamayı reddeder.
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      # true -> Ollama + yerel Qdrant. false -> Evren (barındırılan çıkarım)
      # + Evren'in Qdrant kümesi. Bkz. Settings.LOCAL_MODE.
      - LOCAL_MODE=${LOCAL_MODE:-true}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_REASONING=${OLLAMA_REASONING:-false}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-4096}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      # Evren (yalnızca LOCAL_MODE=false). Anahtarlar ekibin .env'inden gelir,
      # asla commit'lenmez.
      - EVREN_BASE_URL=${EVREN_BASE_URL:-https://evren-llmapi.ssyz.org.tr/v1}
      - EVREN_API_KEY=${EVREN_API_KEY:-}
      - EVREN_LLM_LARGE_MODEL=${EVREN_LLM_LARGE_MODEL:-llm-large}
      - EVREN_LLM_FAST_MODEL=${EVREN_LLM_FAST_MODEL:-llm-fast}
      - EVREN_GUARD_MODEL=${EVREN_GUARD_MODEL:-guard}
      - EVREN_ROUTER_MODEL=${EVREN_ROUTER_MODEL:-router}
      - EVREN_EMBED_MODEL=${EVREN_EMBED_MODEL:-bge-m3-embed}
      - EVREN_REQUEST_TIMEOUT_SECONDS=${EVREN_REQUEST_TIMEOUT_SECONDS:-1800}
      - EVREN_QDRANT_URL=${EVREN_QDRANT_URL:-}
      - EVREN_QDRANT_API_KEY=${EVREN_QDRANT_API_KEY:-}
      # AI iş akışı zaman aşımları (sn). Uzun "deep" koşuları yerelde erken
      # kesilmeden denemek için yükseltilebilir.
      - AI_WORKFLOW_TIMEOUT_SECONDS=${AI_WORKFLOW_TIMEOUT_SECONDS:-480}
      - REVISION_RERETRIEVAL_TIMEOUT_SECONDS=${REVISION_RERETRIEVAL_TIMEOUT_SECONDS:-10}
      - DRAFT_JUDGE_TIMEOUT_SECONDS=${DRAFT_JUDGE_TIMEOUT_SECONDS:-30}
      - GUARDRAIL_JUDGE_TIMEOUT_SECONDS=${GUARDRAIL_JUDGE_TIMEOUT_SECONDS:-15}
      - MEVZUAT_MCP_TIMEOUT_SECONDS=${MEVZUAT_MCP_TIMEOUT_SECONDS:-25}
      # Uygulamanın çalışma zamanı bağlantısı: kısıtlı kachow_app rolü. RLS
      # (0013_rls) tablo sahibine uygulanmaz, bu yüzden uygulama şema sahibi
      # olarak bağlanmamalı.
      - DATABASE_URL=postgresql+asyncpg://kachow_app:${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}@db:5432/${POSTGRES_DB:-kachow}
      # Şema-sahibi bağlantısı: Alembic migration'ları (DDL) ve tenant öncesi
      # dar kimlik sorguları (login/refresh/kayıt) bunu kullanır. db servisiyle
      # aynı POSTGRES_* değerlerinden türetilir.
      - ALEMBIC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kachow}
      - KACHOW_APP_DB_PASSWORD=${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_URL=http://prometheus:9090
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-1234567890}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-1234567890}
      - LANGFUSE_HOST=http://langfuse-web:3000
      # Altyapı span'leri (HTTP/DB/Redis/httpx) -- yalnızca LLM çağrılarını
      # gören Langfuse'dan ayrı. Boş bırakılırsa otel.py sessizce devre dışı.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      # mevzuat-mcp imaja bu yola gömülüdür; buraya işaret edilmezse komut
      # PATH'te olmadığından her canlı mevzuat sorgusu başarısız olur. MCP'yi
      # tümden atlamak için .env'de MEVZUAT_SOURCE=local.
      - MEVZUAT_SOURCE=${MEVZUAT_SOURCE:-mcp}
      - MEVZUAT_MCP_ENABLED=${MEVZUAT_MCP_ENABLED:-false}
      - MEVZUAT_MCP_COMMAND=${MEVZUAT_MCP_COMMAND:-/tmp/mcpvenv/bin/mevzuat-mcp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - qdrant
      - jaeger

  # LoRA/PEFT eğitim worker'ı (#191). Bilerek profile altında: sıradan
  # `docker compose up` bunu başlatmaz, yalnızca
  # `docker compose --profile training up -d worker` (bkz.
  # scripts/start_training_worker.sh). LoRA işi, worker çalışsa da çalışmasa
  # da backend tarafından kuyruğa alınır.
  #
  # Gerçek GPU eğitimi CUDA'lı host ister; GPU rezervasyonu host'a özgü
  # olduğundan burada tanımlanmaz -- eğitim host'unda kendiniz ekleyin.
  # TRAINING_ARTIFACTS_DIR, Ollama sunucu sürecinin de okuyabileceği bir yol
  # olmalıdır.
  worker:
    profiles: ["training"]
    build:
      context: ./
      dockerfile: deploy/docker/worker.Dockerfile
    image: kachow-worker:dev
    container_name: kachow_worker_dev
    volumes:
      - ./backend/app:/workspace/app
      - ./artifacts/training:/workspace/artifacts/training
    environment:
      - ENVIRONMENT=development
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - DATABASE_URL=postgresql+asyncpg://kachow_app:${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}@db:5432/${POSTGRES_DB:-kachow}
      - REDIS_URL=redis://redis:6379/0
      - TRAINING_ARTIFACTS_DIR=/workspace/artifacts/training
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg16
    container_name: kachow_db_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kachow}
      # scripts/init-db.sh (yalnızca boş volume'de) kachow_app rolünü
      # oluştururken okur -- backend'deki KACHOW_APP_DB_PASSWORD ile eşleşmeli.
      - KACHOW_APP_DB_PASSWORD=${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:7-alpine
    container_name: kachow_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kachow_qdrant_dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus:latest
    container_name: kachow_prometheus_dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: kachow_grafana_dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # --- Langfuse v3 (LLM izleme) --------------------------------------------
  # v3, backend'in langfuse v4 Python SDK'sıyla eşleşen sürüm çizgisidir
  # (v4 SDK OTLP ile /api/public/otel'e yazar; v2 sunucuda o uç yok).
  # v3 kendi kendine barındırma: Postgres (var) + ClickHouse + Redis (var,
  # ayrı DB indeksi) + S3 uyumlu blob deposu (MinIO). Bunlar sağlanmadan
  # web/worker başlamaz.
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: kachow_clickhouse_dev
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: kachow_minio_dev
    command: server /data --console-address ":9001"
    ports:
      - "9002:9001"   # MinIO konsolu (9000/9001 Langfuse/başka servislerde)
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-miniosecret}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    container_name: kachow_minio_init_dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD:-miniosecret} &&
      mc mb --ignore-existing local/langfuse &&
      echo 'langfuse bucket hazır'
      "
    restart: "no"

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: kachow_langfuse_dev
    ports:
      - "3000:3000"
    environment: &langfuse_env
      # Ayrı "langfuse" veritabanı; uygulamanın "kachow" DB'siyle aynı
      # Postgres örneği ve kimlik bilgileri (bkz. scripts/init-db.sh).
      # NOT: v2'den v3'e geçerken bu DB bir kez sıfırlanmalıdır
      # (DROP DATABASE langfuse; CREATE DATABASE langfuse;).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/langfuse
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_CONNECTION_STRING=redis://redis:6379/1
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-my_nextauth_secret_for_dev_only_123}
      - SALT=${LANGFUSE_SALT:-my_salt_for_dev_only_123}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - TELEMETRY_ENABLED=false
      - LANGFUSE_INIT_ORG_ID=kachow
      - LANGFUSE_INIT_ORG_NAME=KACHOW
      - LANGFUSE_INIT_PROJECT_ID=kachow
      - LANGFUSE_INIT_PROJECT_NAME=KACHOW
      # Proje anahtarları .env'deki backend değerlerinden alınır -> manuel
      # "proje oluştur, anahtar kopyala" adımı yok; backend hazır çalışır.
      - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-1234567890}
      - LANGFUSE_INIT_PROJECT_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-1234567890}
      - LANGFUSE_INIT_USER_EMAIL=${LANGFUSE_INIT_USER_EMAIL:-admin@kachow.example}
      - LANGFUSE_INIT_USER_NAME=KACHOW Admin
      - LANGFUSE_INIT_USER_PASSWORD=${LANGFUSE_INIT_USER_PASSWORD:-langfuse-dev-only}
    depends_on:
      db:
        condition: service_started
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: kachow_langfuse_worker_dev
    environment: *langfuse_env
    depends_on:
      langfuse-web:
        condition: service_started

  # otel.py'nin ürettiği altyapı span'leri için OTLP collector + arayüz
  # (Langfuse'dan ayrı). All-in-one imaj 4317'de OTLP/gRPC alıcısını hazır sunar.
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: kachow_jaeger_dev
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  frontend:
    build:
      context: ./
      dockerfile: deploy/docker/frontend.Dockerfile
    image: kachow-frontend:dev
    container_name: kachow_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      # Varsayılan kapalı: backend REQUIRE_AUTH=true olduğundan bypass'lı
      # oturumun gerçek JWT'si olmaz ve her çağrı 401 alır. Yalnızca backend'i
      # REQUIRE_AUTH=false ile çalıştırırken aç.
      - VITE_DEV_AUTH_BYPASS=${VITE_DEV_AUTH_BYPASS:-false}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  clickhouse_data:
  minio_data:
