services:
  backend:
    build:
      context: ./
      dockerfile: deploy/docker/backend.Dockerfile
    image: kachow-backend:dev
    container_name: kachow_backend_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/workspace/app
      - ./backend/tests:/workspace/tests
      - ./backend/alembic:/workspace/alembic
      - ./backend/alembic.ini:/workspace/alembic.ini
      - ./backend/pyproject.toml:/workspace/pyproject.toml
      - ./scripts:/workspace/scripts
      - ./datasets:/workspace/datasets
      # The evaluation harness and its gold sets. Mounted rather than only
      # baked into the image so `make eval` picks up dataset edits without a
      # rebuild -- the gold sets are edited far more often than the code.
      - ./evaluation:/workspace/evaluation
      # k6 load-test scripts and scripts/export_budgets.py's own output
      # (perf/k6/lib/budgets.json) -- mounted so that script's write lands
      # on the host to be committed, not lost with the container on --rm.
      - ./perf:/workspace/perf
      # Uploaded documents and their analysis cache (settings.LOCAL_STORAGE_DIR,
      # "./storage_data" relative to /workspace). Without this mount it lives
      # only in the container's writable layer: every document's DB row
      # (GET /documents' library listing, including its summary) is backed by
      # the real postgres_data volume and survives a container recreate, but
      # its analysis cache JSON (backing GET /documents/{path} and the AI
      # workflow's cached-document reads) does not -- producing a document
      # that shows a summary in the library but 404s as "Bu evrak için bir
      # analiz bulunamadı" the moment it's opened.
      - ./backend/storage_data:/workspace/storage_data
    environment:
      - ENVIRONMENT=development
      # Local demo mode only. Production refuses to start while auth is off.
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_REASONING=${OLLAMA_REASONING:-false}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-4096}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      # AI workflow timeouts (seconds). Raise these to test long-running
      # "deep" reasoning runs locally without them being cut off early.
      - AI_WORKFLOW_TIMEOUT_SECONDS=${AI_WORKFLOW_TIMEOUT_SECONDS:-480}
      - REVISION_RERETRIEVAL_TIMEOUT_SECONDS=${REVISION_RERETRIEVAL_TIMEOUT_SECONDS:-10}
      - DRAFT_JUDGE_TIMEOUT_SECONDS=${DRAFT_JUDGE_TIMEOUT_SECONDS:-30}
      - GUARDRAIL_JUDGE_TIMEOUT_SECONDS=${GUARDRAIL_JUDGE_TIMEOUT_SECONDS:-15}
      - MEVZUAT_MCP_TIMEOUT_SECONDS=${MEVZUAT_MCP_TIMEOUT_SECONDS:-25}
      # The app's runtime connection: the restricted kachow_app role, not
      # the schema owner -- Postgres row-level security (migration
      # 0013_rls) never applies to a table's owner, so the app must not
      # connect as one. See app.core.config.Settings.DATABASE_URL's own
      # docstring.
      - DATABASE_URL=postgresql+asyncpg://kachow_app:${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}@db:5432/${POSTGRES_DB:-kachow}
      # The schema-owner connection: Alembic migrations (DDL) and the
      # narrow pre-tenant identity lookups in app.infrastructure.database.
      # session.get_owner_db (login/refresh/registration) still need this.
      # Derived from the same POSTGRES_* values as the db service below, so
      # the two can never drift out of sync with each other.
      - ALEMBIC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-kachow}
      - KACHOW_APP_DB_PASSWORD=${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-1234567890}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-1234567890}
      - LANGFUSE_HOST=http://langfuse:3000
      # mevzuat-mcp is baked into the image (backend.Dockerfile) at this
      # exact path -- without pointing this at it, MEVZUAT_MCP_COMMAND falls
      # back to the bare "mevzuat-mcp", which is not on PATH, and every
      # live legislation fetch fails identically before ever reaching the
      # network. Override MEVZUAT_SOURCE=local in a root .env to skip MCP
      # entirely and always use the committed corpus.
      - MEVZUAT_SOURCE=${MEVZUAT_SOURCE:-mcp}
      - MEVZUAT_MCP_ENABLED=${MEVZUAT_MCP_ENABLED:-false}
      - MEVZUAT_MCP_COMMAND=${MEVZUAT_MCP_COMMAND:-/tmp/mcpvenv/bin/mevzuat-mcp}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - qdrant

  # LoRA/PEFT training worker (Faz C3 Aşama 3, #191). Deliberately under a
  # profile, not a plain service: `docker compose up`/`up -d` never starts
  # this, only `docker compose --profile training up -d worker` does --
  # scripts/start_training_worker.sh wraps exactly that command, and
  # scripts/stop_training_worker.sh stops it again. A LoRA run is enqueued
  # by the ordinary backend process (POST /companies/{id}/training-runs
  # ?kind=lora_sft) regardless of whether this worker happens to be
  # running -- an unattended queue with nothing consuming it is the correct
  # "not running right now" state, not an error.
  #
  # Real GPU fine-tuning needs a CUDA-capable host and driver -- this
  # compose definition intentionally does not reserve a GPU
  # (`deploy.resources.reservations.devices`) since that syntax is
  # host/runtime-specific (nvidia-container-toolkit) and would break `up`
  # on a machine without one configured; add that block yourself on the
  # actual training host.
  #
  # TRAINING_ARTIFACTS_DIR must be a path Ollama's own server process can
  # also read (see app.workers.training._ollama_create's docstring) --
  # the local bind mount below only makes it visible to *this* container.
  worker:
    profiles: ["training"]
    build:
      context: ./
      dockerfile: deploy/docker/worker.Dockerfile
    image: kachow-worker:dev
    container_name: kachow_worker_dev
    volumes:
      - ./backend/app:/workspace/app
      - ./artifacts/training:/workspace/artifacts/training
    environment:
      - ENVIRONMENT=development
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - DATABASE_URL=postgresql+asyncpg://kachow_app:${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}@db:5432/${POSTGRES_DB:-kachow}
      - REDIS_URL=redis://redis:6379/0
      - TRAINING_ARTIFACTS_DIR=/workspace/artifacts/training
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg16
    container_name: kachow_db_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-kachow}
      # Read by scripts/init-db.sh (docker-entrypoint-initdb.d, fresh
      # volumes only) to create the kachow_app role -- must match the
      # backend service's KACHOW_APP_DB_PASSWORD above.
      - KACHOW_APP_DB_PASSWORD=${KACHOW_APP_DB_PASSWORD:-kachow_app_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:7-alpine
    container_name: kachow_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kachow_qdrant_dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  prometheus:
    image: prom/prometheus:latest
    container_name: kachow_prometheus_dev
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: kachow_grafana_dev
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  langfuse:
    # v2 server is not compatible with the v4 langfuse Python SDK the backend
    # depends on (backend/requirements.txt); v3 is the matching server line.
    image: langfuse/langfuse:2
    container_name: kachow_langfuse_dev
    ports:
      - "3000:3000"
    environment:
      # A separate "langfuse" database on the same Postgres instance/creds as
      # the app's own db -- not POSTGRES_DB, which is the app's "kachow" db.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/langfuse
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-my_nextauth_secret_for_dev_only_123}
      - SALT=${LANGFUSE_SALT:-my_salt_for_dev_only_123}
      - ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
    depends_on:
      - db

  frontend:
    build:
      context: ./
      dockerfile: deploy/docker/frontend.Dockerfile
    image: kachow-frontend:dev
    container_name: kachow_frontend_dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
      # Off by default: the backend's own REQUIRE_AUTH default is `true`
      # (see the backend service above), so a bypassed frontend session has
      # no real JWT and every authenticated call 401s -- opt in explicitly
      # (VITE_DEV_AUTH_BYPASS=true) only when also running the backend with
      # REQUIRE_AUTH=false.
      - VITE_DEV_AUTH_BYPASS=${VITE_DEV_AUTH_BYPASS:-false}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
