[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
timeout = 60
filterwarnings = [
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:langchain.*",
    "ignore::DeprecationWarning:pydantic.*",
]
addopts = "-m 'not e2e'"
markers = [
    "integration: exercises real infra (Postgres/Redis/Qdrant/Ollama); skipped by default in CI",
    "e2e: real ASGI HTTP client against the full app (RLS, real lifespan, fake LLM/embeddings) -- deselected by addopts above, run explicitly with `pytest -m e2e`",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
