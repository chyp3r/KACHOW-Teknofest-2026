# Served through deploy/docker/frontend.prod.Dockerfile's nginxinc/
# nginx-unprivileged base image, which already listens on a port >1024
# (8080) and runs as a non-root uid by default -- this file only needs to
# describe the server block, not container privilege dropping.
server {
    listen 8080;
    server_name localhost;

    # gzip the text-heavy build output (JS/CSS bundles, index.html); binary
    # assets (images, fonts) are already compressed and gain nothing.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Kubernetes readiness/liveness probe target -- see
    # deploy/kubernetes/frontend.yaml (Workstream G). A static 200 is enough:
    # nginx itself being able to answer is the only thing being checked.
    location = /healthz {
        return 200;
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend. This location block, not a build-time
    # VITE_API_BASE_URL, is how the SPA reaches the backend in production:
    # frontend/src/services/apiClient.ts calls fetch() with relative
    # "/api/v1/..." paths exclusively (no base-URL env var exists anywhere
    # in frontend/src), so the origin the browser actually talks to is
    # always this nginx server, and this proxy is the only thing that makes
    # "/api/..." resolve to the backend rather than 404ing against static
    # files.
    #
    # $backend_upstream (not a literal "http://backend:8000" in proxy_pass)
    # is deliberate: a literal hostname there is resolved once, at nginx's
    # own startup, and Compose only registers a service's embedded-DNS name
    # once that service's container has actually been created -- so if this
    # frontend container starts before "backend" does, nginx refuses to
    # start at all ("host not found in upstream"), confirmed by actually
    # booting this image standalone (no backend on the network) and
    # watching it crash-loop. A variable defers resolution to request time
    # against `resolver`, so nginx starts regardless of ordering and a
    # request only 502s (not a container that never comes up) until
    # backend's name resolves. 127.0.0.11 is Docker's embedded DNS server,
    # correct for compose.prod.yml; this whole /api block is unreachable in
    # the Kubernetes path (Workstream G's ingress routes /api/* to the
    # backend Service directly, before traffic ever reaches this
    # container), so it does not need to also handle CoreDNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Disable buffering and cache for SSE (Server-Sent Events) streaming
        # -- matches the X-Accel-Buffering: no header
        # app.api.routers.chat._sse_response already sets, and the
        # nginx-ingress annotations of the same name in
        # deploy/kubernetes/ingress.yaml (Workstream G) for the k8s path.
        proxy_buffering off;
        proxy_cache off;

        # Increase proxy timeouts for slow LLM/Ollama workflows
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        keepalive_timeout 600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
