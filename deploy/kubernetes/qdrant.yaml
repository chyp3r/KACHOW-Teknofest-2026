# StatefulSet, same reasoning as postgres.yaml: a stable identity + its own
# persistent volume, self-hosted-fallback rather than a recommendation over
# a managed vector database. Qdrant does support clustering, but this file
# runs a single node -- clustering is a real option for a future PR, not
# assumed here.
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: kachow
spec:
  clusterIP: None
  selector:
    app: kachow-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: kachow
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: kachow-qdrant
  template:
    metadata:
      labels:
        app: kachow-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
            - containerPort: 6334
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          # qdrant/qdrant ships neither curl nor wget (verified against the
          # image directly -- Debian slim base); bash's own /dev/tcp issues
          # a bare HTTP GET instead, same technique compose.prod.yml's own
          # qdrant healthcheck uses.
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  exec 3<>/dev/tcp/127.0.0.1/6333 &&
                  printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
                  head -1 <&3 | grep -q 200
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - >-
                  exec 3<>/dev/tcp/127.0.0.1/6333 &&
                  printf 'GET /livez HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
                  head -1 <&3 | grep -q 200
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
