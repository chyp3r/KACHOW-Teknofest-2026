# PLACEHOLDER VALUES -- every value below is a literal placeholder string,
# not a real secret, and MUST be replaced before this is ever applied to a
# real cluster. This file exists to document the exact shape/keys
# `backend.yaml`/`migrate-job.yaml` expect, not as a safe way to actually
# ship secrets: a plain `Secret` manifest checked into git (even with
# placeholder values today) invites a real value being pasted in later and
# committed by habit.
#
# `SECRET_KEY`'s placeholder is the exact same default
# `app.core.config.Settings.SECRET_KEY` ships with -- and
# `app.lifespan._require_secret_key_in_production` refuses to boot against
# it (see backend.prod.Dockerfile's HEALTHCHECK; the pod will CrashLoop,
# loudly, rather than silently accept a compromised key). The Secret
# *object* still has to exist with the right keys for backend.yaml's
# `envFrom`/`secretKeyRef` to resolve, so the placeholder documents the
# shape while still failing safely if someone forgets to fill it in.
#
# Three supported ways to actually populate this in production, in
# ascending order of operational maturity:
#   1. `kubectl create secret generic kachow-secrets --from-literal=...`
#      run by hand, never committed -- fine for a small/first deployment.
#   2. Sealed Secrets (bitnami-labs/sealed-secrets) -- encrypt with the
#      cluster's public key, commit the *encrypted* SealedSecret instead
#      of this file.
#   3. External Secrets Operator (ESO) + a real secret store (Vault, AWS
#      Secrets Manager, GCP Secret Manager) -- see the commented
#      ExternalSecret example at the bottom of this file.
apiVersion: v1
kind: Secret
metadata:
  name: kachow-secrets
  namespace: kachow
type: Opaque
stringData:
  # See app.core.config.Settings.SECRET_KEY / app.lifespan.
  # _require_secret_key_in_production. Generate with: openssl rand -hex 32
  SECRET_KEY: "supersecretkeychangeinproduction"

  # Schema-owner role -- migrations (migrate-job.yaml) and the pre-tenant
  # identity lookups in app.infrastructure.database.session.get_owner_db.
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "changeme-postgres-owner-password"

  # The restricted, RLS-subject runtime role the backend actually connects
  # as for everything else -- see compose.yml's own comment on why this
  # must never be the owner role above. Read by scripts/init-db.sh
  # (postgres.yaml's initdb hook) to create the role on a fresh volume.
  KACHOW_APP_DB_PASSWORD: "changeme-kachow-app-password"

  # Optional -- unset/placeholder means the backend simply runs without
  # LLM tracing (same degrade as compose.yml's own dev defaults).
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""

  # Only read when configmap.yaml's LOCAL_MODE is "false" -- REQUIRED in
  # that mode, unlike every other placeholder in this file: an empty
  # EVREN_API_KEY does not degrade gracefully, every LLM/embedding call
  # fails. See configmap.yaml's own LOCAL_MODE comment before setting
  # LOCAL_MODE=false there without filling these in.
  EVREN_API_KEY: "changeme-evren-api-key"
  EVREN_QDRANT_API_KEY: "changeme-evren-qdrant-api-key"

  # Only read when configmap.yaml's STORAGE_TYPE is "s3" -- irrelevant
  # (and safe to leave as placeholders) under the "local" default.
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

---
