# Production override for compose.yml. Applied on top of it, never alone:
#
#   docker compose -f compose.yml -f compose.prod.yml --env-file .env.prod up -d
#
# Services this file does not mention (worker, prometheus, grafana,
# langfuse, jaeger) are inherited from compose.yml unchanged -- monitoring/alerting
# wiring for a production stack is Workstream H, not this file. `${VAR:?...}`
# throughout is deliberate: compose.yml's own `${VAR:-dev_default}` fallbacks
# exist so a bare `docker compose up` works with zero setup, which is
# exactly wrong for production -- a missing secret here must fail `up`
# immediately, not silently boot with a public default (see
# app.lifespan._require_auth_in_production/_require_secret_key_in_production
# for the same principle enforced a second time, inside the process itself).
#
# `!override`/`!reset` are Compose Specification merge-control tags: the
# base file's list-valued fields (`volumes`, `ports`, `environment`) are
# concatenated with this file's by default, which is never what a
# production override of a dev-bind-mount list wants.

services:
  backend:
    build:
      dockerfile: deploy/docker/backend.prod.Dockerfile
    image: kachow-backend:${IMAGE_TAG:-latest}
    # compose.yml's own container_name carries a "_dev" suffix -- reset
    # rather than inherited, so `docker ps` doesn't call a production
    # container a dev one. `null` lets Compose fall back to its normal
    # <project>-<service>-<index> naming.
    container_name: !reset null
    # No bind-mounted source (that's what makes this the prod image rather
    # than the dev one with prod env slapped on) -- only the named volume
    # backing settings.LOCAL_STORAGE_DIR survives a container recreate.
    # NOTE: this is a single named volume, so `backend` cannot be scaled
    # past 1 replica here without also carrying the analysis-cache-on-disk
    # fix (Workstream J9) -- see deploy/kubernetes/backend.yaml's own note
    # once that manifest exists.
    volumes: !override
      - backend_storage_data:/workspace/storage_data
    ports: !reset []
    environment: !override
      - ENVIRONMENT=production
      - REQUIRE_AUTH=true
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.prod -- see app.lifespan._require_secret_key_in_production}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:?OLLAMA_BASE_URL must be set in .env.prod (e.g. http://host.docker.internal:11434 or a dedicated Ollama host)}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_REASONING=${OLLAMA_REASONING:-false}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-4096}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      - AI_WORKFLOW_TIMEOUT_SECONDS=${AI_WORKFLOW_TIMEOUT_SECONDS:-480}
      - REVISION_RERETRIEVAL_TIMEOUT_SECONDS=${REVISION_RERETRIEVAL_TIMEOUT_SECONDS:-10}
      - DRAFT_JUDGE_TIMEOUT_SECONDS=${DRAFT_JUDGE_TIMEOUT_SECONDS:-30}
      - GUARDRAIL_JUDGE_TIMEOUT_SECONDS=${GUARDRAIL_JUDGE_TIMEOUT_SECONDS:-15}
      - MEVZUAT_MCP_TIMEOUT_SECONDS=${MEVZUAT_MCP_TIMEOUT_SECONDS:-25}
      # The restricted kachow_app role -- see compose.yml's own comment on
      # why the app must never connect as the schema owner.
      - DATABASE_URL=postgresql+asyncpg://kachow_app:${KACHOW_APP_DB_PASSWORD:?KACHOW_APP_DB_PASSWORD must be set in .env.prod}@db:5432/${POSTGRES_DB:-kachow}
      - ALEMBIC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set in .env.prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}@db:5432/${POSTGRES_DB:-kachow}
      - KACHOW_APP_DB_PASSWORD=${KACHOW_APP_DB_PASSWORD:?KACHOW_APP_DB_PASSWORD must be set in .env.prod}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      # Infrastructure spans (HTTP/DB/Redis/outbound httpx) -- separate from
      # Langfuse above. `jaeger` (inherited unchanged from compose.yml, see
      # this file's header) is a fine default for a single-node deployment;
      # point this at a real OTLP collector for a multi-node one. Empty
      # disables it entirely (app/observability/otel.py's no-op degrade).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      # Live mevzuat.gov.tr scraping is off by default in the prod image
      # (backend.prod.Dockerfile's WITH_MEVZUAT_MCP=0) -- MEVZUAT_SOURCE
      # must match, or every legislation lookup pays a doomed MCP attempt
      # before falling back (harmless but wasteful; see backend.prod.
      # Dockerfile's own comment). Operators who built with
      # --build-arg WITH_MEVZUAT_MCP=1 override this in .env.prod.
      - MEVZUAT_SOURCE=${MEVZUAT_SOURCE:-local}
      - MEVZUAT_MCP_ENABLED=${MEVZUAT_MCP_ENABLED:-false}
      - MEVZUAT_MCP_COMMAND=${MEVZUAT_MCP_COMMAND:-/tmp/mcpvenv/bin/mevzuat-mcp}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot schema migration, run to completion before `backend` starts --
  # this is what replaces `make bootstrap`'s manual `alembic upgrade head`
  # step in production. Not an initContainer-style pattern here (this is
  # Compose, not Kubernetes -- see deploy/kubernetes/backend.yaml, Workstream
  # G, for that environment's own equivalent, a separate migrate-job.yaml
  # rather than a Deployment initContainer, for the same reason: with
  # `backend` scaled to more than one instance, two initContainers would
  # race on the same `alembic upgrade head`).
  migrate:
    build:
      context: ./
      dockerfile: deploy/docker/backend.prod.Dockerfile
    image: kachow-backend:${IMAGE_TAG:-latest}
    environment:
      - ALEMBIC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set in .env.prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}@db:5432/${POSTGRES_DB:-kachow}
    entrypoint: ["alembic", "upgrade", "head"]
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kachow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    # qdrant/qdrant ships neither curl nor wget (Debian slim base, verified
    # by inspecting the image) -- bash's own /dev/tcp is used to issue a
    # bare HTTP GET against /readyz instead of adding a package.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      dockerfile: deploy/docker/frontend.prod.Dockerfile
    image: kachow-frontend:${IMAGE_TAG:-latest}
    container_name: !reset null
    # !override, not a plain list -- compose.yml's own "5173:5173" (the Vite
    # dev server's port) would otherwise stay published alongside this one;
    # confirmed by `docker compose config` actually listing both ports
    # before this override tag was added.
    ports: !override
      - "${FRONTEND_PORT:-80}:8080"
    volumes: !override []
    environment: !override []
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Not present in compose.yml at all -- dev relies on Prometheus/Grafana's
  # own UI to see a firing alert (see kachow.rules.yml, Workstream H2);
  # only a production stack routes alerts somewhere a human sees without
  # opening that UI. prometheus.yml's `alerting:` block already points at
  # `alertmanager:9093` unconditionally (harmless in dev -- Prometheus
  # tolerates an unreachable alertmanager target, verified), so no
  # override of the `prometheus` service is needed here, only this.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: !reset null
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_storage_data:
