# compose.yml için üretim override'ı. Tek başına değil, üstüne uygulanır:
#
#   docker compose -f compose.yml -f compose.prod.yml --env-file .env.prod up -d
#
# Burada anılmayan servisler (worker, prometheus, grafana, langfuse, jaeger)
# compose.yml'den olduğu gibi devralınır. Her yerde `${VAR:?...}` bilerek:
# compose.yml'nin dev varsayılanlarının aksine, eksik bir sır üretimde `up`'ı
# anında hataya düşürmeli, sessizce açık varsayılanla açılmamalı.
#
# `!override`/`!reset`: Compose birleştirme kontrol etiketleri. Liste alanları
# (volumes/ports/environment) varsayılan olarak birleştirilir; bir üretim
# override'ı dev bind-mount listesini bunun yerine değiştirmek/sıfırlamak ister.

services:
  backend:
    build:
      dockerfile: deploy/docker/backend.prod.Dockerfile
    image: kachow-backend:${IMAGE_TAG:-latest}
    # compose.yml'nin adı "_dev" ekli; `docker ps`'te üretim container'ına
    # dev demesin diye sıfırlanır (null -> Compose normal adlandırması).
    container_name: !reset null
    # Bind-mount edilmiş kaynak yok (bu, imajı üretim imajı yapan şey) --
    # yalnızca settings.LOCAL_STORAGE_DIR'i tutan adlandırılmış volume kalıcı.
    # NOT: tek volume olduğundan `backend`, disk-önbellek düzeltmesi olmadan
    # 1 replikanın ötesine ölçeklenemez.
    volumes: !override
      - backend_storage_data:/workspace/storage_data
    ports: !reset []
    environment: !override
      - ENVIRONMENT=production
      - REQUIRE_AUTH=true
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env.prod -- see app.lifespan._require_secret_key_in_production}
      # true -> Ollama + yerel Qdrant. false -> Evren (barındırılan çıkarım)
      # + Evren'in Qdrant kümesi. Bkz. Settings.LOCAL_MODE.
      - LOCAL_MODE=${LOCAL_MODE:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:?OLLAMA_BASE_URL must be set in .env.prod (e.g. http://host.docker.internal:11434 or a dedicated Ollama host)}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:9b}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.7}
      - OLLAMA_REASONING=${OLLAMA_REASONING:-false}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-4096}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_FAST_MODEL=${OLLAMA_FAST_MODEL:-}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text:latest}
      # Evren (yalnızca LOCAL_MODE=false). Anahtarlar .env.prod'dan gelir,
      # asla commit'lenmez.
      - EVREN_BASE_URL=${EVREN_BASE_URL:-https://evren-llmapi.ssyz.org.tr/v1}
      - EVREN_API_KEY=${EVREN_API_KEY:-}
      - EVREN_LLM_LARGE_MODEL=${EVREN_LLM_LARGE_MODEL:-llm-large}
      - EVREN_LLM_FAST_MODEL=${EVREN_LLM_FAST_MODEL:-llm-fast}
      - EVREN_GUARD_MODEL=${EVREN_GUARD_MODEL:-guard}
      - EVREN_ROUTER_MODEL=${EVREN_ROUTER_MODEL:-router}
      - EVREN_EMBED_MODEL=${EVREN_EMBED_MODEL:-bge-m3-embed}
      - EVREN_REQUEST_TIMEOUT_SECONDS=${EVREN_REQUEST_TIMEOUT_SECONDS:-1800}
      - EVREN_QDRANT_URL=${EVREN_QDRANT_URL:-}
      - EVREN_QDRANT_API_KEY=${EVREN_QDRANT_API_KEY:-}
      - AI_WORKFLOW_TIMEOUT_SECONDS=${AI_WORKFLOW_TIMEOUT_SECONDS:-480}
      - REVISION_RERETRIEVAL_TIMEOUT_SECONDS=${REVISION_RERETRIEVAL_TIMEOUT_SECONDS:-10}
      - DRAFT_JUDGE_TIMEOUT_SECONDS=${DRAFT_JUDGE_TIMEOUT_SECONDS:-30}
      - GUARDRAIL_JUDGE_TIMEOUT_SECONDS=${GUARDRAIL_JUDGE_TIMEOUT_SECONDS:-15}
      - MEVZUAT_MCP_TIMEOUT_SECONDS=${MEVZUAT_MCP_TIMEOUT_SECONDS:-25}
      # Kısıtlı kachow_app rolü -- uygulama neden şema sahibi olarak
      # bağlanmamalı, bkz. compose.yml'deki not.
      - DATABASE_URL=postgresql+asyncpg://kachow_app:${KACHOW_APP_DB_PASSWORD:?KACHOW_APP_DB_PASSWORD must be set in .env.prod}@db:5432/${POSTGRES_DB:-kachow}
      - ALEMBIC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set in .env.prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}@db:5432/${POSTGRES_DB:-kachow}
      - KACHOW_APP_DB_PASSWORD=${KACHOW_APP_DB_PASSWORD:?KACHOW_APP_DB_PASSWORD must be set in .env.prod}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      # Altyapı span'leri (HTTP/DB/Redis/httpx) -- Langfuse'dan ayrı. Tek
      # düğüm için `jaeger` yeterli; çok düğümde gerçek bir OTLP collector'a
      # işaret ettir. Boş bırakılırsa otel.py sessizce devre dışı.
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      # Canlı mevzuat.gov.tr sorgusu üretim imajında varsayılan kapalı
      # (WITH_MEVZUAT_MCP=0) -- MEVZUAT_SOURCE eşleşmezse her sorgu boşa bir
      # MCP denemesi yapar. --build-arg WITH_MEVZUAT_MCP=1 ile derleyenler
      # .env.prod'da override eder.
      - MEVZUAT_SOURCE=${MEVZUAT_SOURCE:-local}
      - MEVZUAT_MCP_ENABLED=${MEVZUAT_MCP_ENABLED:-false}
      - MEVZUAT_MCP_COMMAND=${MEVZUAT_MCP_COMMAND:-/tmp/mcpvenv/bin/mevzuat-mcp}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Tek seferlik şema migration'ı; `backend` başlamadan önce tamamlanır
  # (üretimde `make bootstrap`'in manuel `alembic upgrade head` adımının
  # yerine geçer). Kubernetes'te karşılığı ayrı bir migrate-job'dur.
  migrate:
    build:
      context: ./
      dockerfile: deploy/docker/backend.prod.Dockerfile
    image: kachow-backend:${IMAGE_TAG:-latest}
    environment:
      - ALEMBIC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER must be set in .env.prod}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.prod}@db:5432/${POSTGRES_DB:-kachow}
    entrypoint: ["alembic", "upgrade", "head"]
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kachow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    container_name: !reset null
    ports: !reset []
    restart: unless-stopped
    # qdrant/qdrant imajında curl/wget yok; paket eklemek yerine bash'in
    # /dev/tcp'siyle /readyz'e çıplak bir HTTP GET atılır.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      dockerfile: deploy/docker/frontend.prod.Dockerfile
    image: kachow-frontend:${IMAGE_TAG:-latest}
    container_name: !reset null
    # !override: yoksa compose.yml'nin "5173:5173" (Vite dev sunucusu) portu
    # bunun yanında yayınlanmaya devam eder.
    ports: !override
      - "${FRONTEND_PORT:-80}:8080"
    volumes: !override []
    environment: !override []
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # compose.yml'de yok -- yalnızca üretim yığını uyarıları bir yere
  # yönlendirir. prometheus.yml'nin `alerting:` bloğu zaten
  # `alertmanager:9093`'e işaret ettiğinden `prometheus` servisi için
  # override gerekmez, yalnızca bu servis.
  alertmanager:
    image: prom/alertmanager:latest
    container_name: !reset null
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_storage_data:
