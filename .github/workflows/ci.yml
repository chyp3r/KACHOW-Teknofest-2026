name: CI

# Mirrors `make test` / `make bootstrap` exactly -- this repo has no
# separate CI-only lane (see backend/tests/_db_fixtures.py's own
# docstring). Backend tests run the same way here as on a contributor's
# machine: against the real compose `db`/`redis`/`qdrant` services, through
# the real Alembic migration chain, inside the real backend image.
#
# Manual trigger only (workflow_dispatch) -- no push/pull_request triggers,
# by design: this pipeline is run on demand from the Actions tab, not on
# every commit.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .env for compose
        run: cp .env.example .env

      - name: Start db, redis, qdrant
        run: docker compose up -d --build db redis qdrant

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T db pg_isready -U postgres && break
            sleep 2
          done

      - name: Run Alembic migrations
        run: docker compose run --rm --no-deps backend alembic upgrade head

      - name: Run backend test suite (unit + integration, cov-gated)
        run: docker compose run --rm backend pytest -q --cov-fail-under=86

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run test:coverage
